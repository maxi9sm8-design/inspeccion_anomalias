<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Control de Pasajeros</title>
    <!-- CSS Estilos Integrados -->
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1, h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #1a252f;
        }

        .form-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            margin-bottom: 30px;
        }

        .grid-form {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        label {
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 14px;
            color: #495057;
        }

        input, select, textarea {
            padding: 10px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #007bff;
        }

        /* Selector múltiple de máquinas */
        .maquinas-checkbox-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 8px;
            background: #fff;
            padding: 12px;
            border: 1px solid #ced4da;
            border-radius: 6px;
            max-height: 180px;
            overflow-y: auto;
        }

        .chk-item {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            cursor: pointer;
        }

        .chk-item input {
            cursor: pointer;
        }

        .btn-submit {
            grid-column: 1 / -1;
            background-color: #28a745;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #218838;
        }

        .btn-export {
            background-color: #17a2b8;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            display: inline-block;
        }

        .btn-export:hover {
            background-color: #138496;
        }

        .filters-section {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 20px;
            background: #e9ecef;
            padding: 15px;
            border-radius: 8px;
        }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
        }

        th, td {
            border: 1px solid #dee2e6;
            padding: 12px;
            text-align: left;
            vertical-align: middle;
        }

        th {
            background-color: #343a40;
            color: white;
            font-weight: 600;
        }

        tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        .btn-danger {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-danger:hover {
            background-color: #c82333;
        }

        /* Modal / Overlay de Login */
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .login-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            text-align: center;
        }

        /* Barra Usuario Activo */
        #userInfo {
            display: none;
            justify-content: space-between;
            align-items: center;
            background: #e2e3e5;
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #d6d8db;
        }

        @media (max-width: 768px) {
            .grid-form {
                grid-template-columns: 1fr;
            }
            .filters-section {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>

    <!-- Librería ExcelJS para incrustar fotos reales en archivos .xlsx -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
</head>
<body>

    <!-- MODAL DE AUTENTICACIÓN / LOGIN -->
    <div id="loginOverlay">
        <div class="login-card">
            <h2>Acceso al Sistema</h2>
            <p style="color: #6c757d; margin-bottom: 20px; font-size: 14px;">Inicia sesión con tu cuenta de Firebase</p>
            <form id="formLogin">
                <div class="form-group" style="text-align: left; margin-bottom: 15px;">
                    <label>Correo Electrónico:</label>
                    <input type="email" id="loginEmail" placeholder="usuario@correo.com" required>
                </div>
                <div class="form-group" style="text-align: left; margin-bottom: 20px;">
                    <label>Contraseña:</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit" style="margin-top:0;">Iniciar Sesión</button>
                <p id="loginError" style="color: red; margin-top: 15px; display: none; font-size: 14px;"></p>
            </form>
        </div>
    </div>

    <div class="container">
        <!-- BARRA SUPERIOR DE USUARIO -->
        <div id="userInfo">
            <span>Usuario activo: <strong id="userEmailSpan"></strong></span>
            <button id="btnCerrarSesion" class="btn-danger">Cerrar Sesión</button>
        </div>

        <h1>Sistema de Registro de Control de Pasajeros</h1>

        <!-- FORMULARIO DE INGRESO -->
        <section class="form-section">
            <h2>Nuevo Registro de Inspección</h2>
            <form id="formRegistro">
                <div class="grid-form">
                    <div class="form-group">
                        <label for="fecha">Fecha:</label>
                        <input type="date" id="fecha" required>
                    </div>

                    <div class="form-group">
                        <label for="hora">Hora:</label>
                        <input type="time" id="hora" required>
                    </div>

                    <div class="form-group full-width">
                        <label>Máquina(s) Inspeccionada(s):</label>
                        <div id="maquinasContainer" class="maquinas-checkbox-container">
                            <!-- Se llena dinámicamente con las 21 máquinas desde JS -->
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="ruta">Ruta / Tramo:</label>
                        <input type="text" id="ruta" placeholder="Ej: Centro - Norte" required>
                    </div>

                    <div class="form-group">
                        <label for="conductor">Nombre / ID Conductor:</label>
                        <input type="text" id="conductor" placeholder="Ej: Juan Pérez">
                    </div>

                    <div class="form-group">
                        <label for="pasajerosSinPagar">Pasajeros Sin Pagar:</label>
                        <input type="number" id="pasajerosSinPagar" min="0" value="0" required>
                    </div>

                    <div class="form-group">
                        <label for="lugar">Lugar / Paradero:</label>
                        <input type="text" id="lugar" placeholder="Ej: Av. Principal con Calle 5">
                    </div>

                    <div class="form-group full-width">
                        <label for="mediaInput">Evidencia (Foto o Video):</label>
                        <input type="file" id="mediaInput" accept="image/*,video/*">
                    </div>

                    <div class="form-group full-width">
                        <label for="descripcion">Observaciones / Comentarios:</label>
                        <textarea id="descripcion" rows="3" placeholder="Detalle adicional del control..."></textarea>
                    </div>

                    <button type="submit" class="btn-submit" id="btnGuardar">Guardar Registro</button>
                </div>
            </form>
        </section>

        <!-- FILTROS Y REGISTROS -->
        <section>
            <h2>Registros Almacenados</h2>
            <div class="filters-section">
                <div class="form-group">
                    <label for="filtroMaquina">Filtrar por Máquina:</label>
                    <select id="filtroMaquina">
                        <option value="TODAS">Todas las Máquinas</option>
                        <!-- Se llena dinámicamente desde JS -->
                    </select>
                </div>

                <div class="form-group">
                    <label for="filtroFecha">Filtrar por Fecha:</label>
                    <input type="date" id="filtroFecha">
                </div>

                <button id="btnLimpiarFiltros" style="padding: 10px 15px; background:#6c757d; color:white; border:none; border-radius:6px; cursor:pointer;">Limpiar Filtros</button>
                <button id="btnExportarExcel" class="btn-export">Exportar a Excel (.xlsx con Fotos)</button>
            </div>

            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Máquina(s)</th>
                            <th>Ruta</th>
                            <th>Conductor</th>
                            <th>Sin Pagar</th>
                            <th>Lugar</th>
                            <th>Observaciones</th>
                            <th>Evidencia</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla">
                        <tr>
                            <td colspan="10" style="text-align: center;">Cargando registros...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Módulo Principal de JavaScript -->
    <script type="module" src="app.js"></script>
</body>
</html>
